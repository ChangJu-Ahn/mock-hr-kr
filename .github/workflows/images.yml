name: build-images

# Build and push the two PUBLIC GHCR images used by Azure Container Apps:
#   ghcr.io/changju-ahn/mock-hr-app    (init + api + mcp share this image)
#   ghcr.io/changju-ahn/mock-hr-proxy  (Caddy reverse proxy)
#
# Images are public so ACA can pull them with no registry secret. Package
# visibility is set once (see README); pushes thereafter keep that visibility.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: mock-hr-app
            context: .
            dockerfile: ./Dockerfile
          - image: mock-hr-proxy
            context: ./proxy
            dockerfile: ./proxy/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/changju-ahn/${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/changju-ahn/{0}:latest', matrix.image) || '' }}
