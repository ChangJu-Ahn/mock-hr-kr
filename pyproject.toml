[project]
name = "mock-hr-kr"
version = "0.1.0"
description = "Throwaway mock HR system (HRIS) for agent demos: shared SQLite via web console, REST API, and MCP server."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.200",
    "uvicorn[standard]>=0.30,<0.40",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "mcp>=1.9,<2",
    "starlette>=0.37",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["hr_core", "api", "mcp_server"]

[tool.setuptools.package-data]
hr_core = ["dataset.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
